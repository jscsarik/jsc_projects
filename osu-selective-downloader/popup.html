<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osu! Selective</title>
  <style>
    body {
      width: 400px;
      height: 500px;
      margin: 0;
      background-color: #111;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    #header {
      padding: 15px;
      background: #222;
      border-bottom: 2px solid #ff66aa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    h1 { margin: 0; font-size: 18px; color: white; }
    h1 span { color: #ff66aa; }
    #status { font-size: 12px; color: #888; }

    #canvas-container {
      flex-grow: 1;
      background: #111;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 난이도 리스트 아이템 */
    .diff-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }
    .diff-item:hover {
      background: #222;
      border-color: #444;
    }
    .diff-item.selected {
      background: #2b1d25;
      border-color: #ff66aa;
    }
    .diff-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex-grow: 1;
      min-width: 0;
    }
    .diff-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #555;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .diff-checkbox:checked {
      background: #ff66aa;
      border-color: #ff66aa;
    }
    .diff-checkbox:checked::before {
      content: "";
      width: 8px;
      height: 8px;
      transform: scale(1);
      background-color: white;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .diff-name-text {
      font-size: 13px;
      font-weight: 500;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .diff-badge {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 1.5px 3px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* 하단 컨트롤 패널 */
    #controls {
      padding: 15px;
      background: #222;
      border-top: 1px solid #333;
      z-index: 10;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .btn-group button {
      background: #333;
      border: 1px solid #555;
      color: #ddd;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
    }
    .btn-group button:hover { background: #444; }

    /* 옵션 영역 */
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      width: 100%;
      user-select: none;
      font-size: 12px;
      color: #ccc;
    }
    .toggle-label:hover {
      color: #fff;
    }
    .option-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #555;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .option-checkbox:checked {
      background: #ff66aa;
      border-color: #ff66aa;
    }
    .option-checkbox:checked::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: white;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .video-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #282828;
      color: #888;
      white-space: nowrap;
    }
    .video-badge.has-video {
      background: rgba(255, 102, 170, 0.15);
      color: #ff66aa;
      border: 1px solid rgba(255, 102, 170, 0.3);
    }
    .video-badge.no-video {
      background: #222;
      color: #666;
    }

    /* 다운로드 버튼 */
    #download-btn {
      width: 100%;
      padding: 10px;
      background: #3a4a5a;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    #download-btn:disabled {
      background: #222;
      color: #555;
      cursor: not-allowed;
    }
    #download-btn:not(:disabled):hover {
      background: #4a5a6a;
    }

    /* 진행률 바 */
    #progress-bar-container {
      display: none;
      width: 100%;
      background: #333;
      height: 4px;
      margin-top: 10px;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #ff66aa;
      transition: width 0.3s;
    }
    #progress-text {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>osu! <span>Selective</span></h1>
    <div id="status">Ready</div>
  </div>

  <div id="canvas-container"></div>

  <div id="controls">
    <div class="info-row">
      <div>Selected: <span id="selected-counter" style="color:#ff66aa; font-weight:bold;">0</span></div>
      <div class="btn-group">
        <button id="all-btn">Select All</button>
        <button id="clear-btn">Clear</button>
      </div>
    </div>

    <div class="option-row">
      <label class="toggle-label" id="video-toggle-label" title="배경 동영상(Video)을 .osz 파일에 포함할지 선택합니다.">
        <input type="checkbox" id="video-checkbox" class="option-checkbox">
        <span>배경 영상 포함 (Video)</span>
        <span id="video-badge" class="video-badge">-</span>
      </label>
    </div>

    <button id="download-btn" disabled>Download Selective .osz</button>
    
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
    <span id="progress-text"></span>
  </div>

  <script src="libs/jszip.min.js"></script>
  <script type="module" src="popup.js"></script>

</body>
</html>
